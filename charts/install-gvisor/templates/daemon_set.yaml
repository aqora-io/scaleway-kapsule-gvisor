apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "install-gvisor.fullname" . }}
  labels:
    {{- include "install-gvisor.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "install-gvisor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "install-gvisor.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostPID: true
      hostNetwork: true
      restartPolicy: Always
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: {{ .Chart.Name }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GVISOR_VERSION
              value: {{ .Values.gvisorVersion | quote }}
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: k8s-node
              mountPath: /k8s-node
      volumes:
        - name: k8s-node
          hostPath:
            path: /tmp/gvisor
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
